[package]
name = "sqlite-napi"
version = "1.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sqlite_napi"

[package.metadata.napi]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[dependencies]
napi = { version = "3.12.2", features = ["napi9", "async", "serde-json"] }
napi-derive = "3.6.3"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension", "modern_sqlite", "serialize", "functions", "collation"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
regex = "1.13.1"
once_cell = "1.21.4"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
